[project]
name = "boss-agent"
version = "0.2.0"
description = "个人求职辅助智能体：检索 BOSS 直聘岗位、评估匹配、辅助沟通并追踪状态"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]